name: deploy

# Production deploys happen only here (ADR 003): after CI passes on main, or
# by hand with a commit SHA to roll back. Running it twice for the same SHA
# converges to the same state: .railway/railway.ts is applied and checked to
# have no pending changes, and the deployed image is built from that commit.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (default - latest main). Use an older SHA to roll back; it must contain .railway/railway.ts.
        required: false
      allow_destructive:
        description: Apply changes that delete Railway resources or variables (review the CI plan first).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://recipe-qa-production.up.railway.app
  RAILWAY_SERVICE: recipe-qa
  RAILWAY_CLI_VERSION: 5.68.0

jobs:
  deploy:
    # workflow_run also fires for CI on pull requests, including forks whose
    # branch is named main. Deploy only CI that ran on a push to main in
    # this repository; workflow_dispatch needs write access already.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Resolve full commit SHA
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require the IaC file
        # Commits before the IaC migration cannot be deployed by this
        # workflow: they set neither the infrastructure nor BUILD_SHA.
        run: test -f .railway/railway.ts || { echo "::error::$SHA has no .railway/railway.ts"; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - name: Install Railway CLI and IaC SDK
        run: |
          npm install -g @railway/cli@${RAILWAY_CLI_VERSION}
          npm ci --prefix .railway --no-audit --no-fund

      - name: Apply infrastructure (.railway/railway.ts)
        # Destructive changes (deleting a resource or variable) need an
        # explicit workflow_dispatch with allow_destructive; a merge alone
        # never deletes anything.
        env:
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive && '--confirm-destructive' || '' }}
        run: railway config apply --yes $ALLOW_DESTRUCTIVE
      - name: Check the environment matches the file
        run: railway config plan --detailed-exit-code

      - name: Set the provider key (no redeploy)
        # The value lives in GitHub secrets; railway.ts declares it preserve().
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" \
            | railway variable set ANTHROPIC_API_KEY --stdin --service "$RAILWAY_SERVICE" --skip-deploys

      - name: Build and deploy
        # BUILD_SHA is untracked but not git-ignored, so `railway up` uploads
        # it and the image reports this commit on /healthz.
        run: |
          echo "$SHA" > recipe_qa/BUILD_SHA
          railway up --service "$RAILWAY_SERVICE" --ci -m "deploy ${SHA::12} (${{ github.event_name }})"

      - name: Wait until the new build is live
        run: |
          for i in $(seq 1 60); do
            version=$(curl -fsS "$PUBLIC_URL/healthz" | jq -r .version || true)
            if [ "$version" = "$SHA" ]; then echo "live: $version"; exit 0; fi
            echo "waiting: live=$version want=$SHA"
            sleep 5
          done
          exit 1

      - name: Smoke eval against the public URL (live model)
        run: uv run python evals/run.py --base-url "$PUBLIC_URL"

      - name: Keep the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ env.SHA }}
          path: evals/reports/
          if-no-files-found: ignore
